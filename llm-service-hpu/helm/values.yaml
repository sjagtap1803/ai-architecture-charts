rawDeploymentMode: true

servingRuntime:
  name: vllm-serving-runtime
  knativeTimeout: 60m
  image: quay.io/modh/vllm@sha256:af6a071be36d8a99476f145d1589d7ede97d2760b93335b14ca26de7417e438c
  recommendedAccelerators:
    - habana.ai/gaudi
  env:
    - name: HOME
      value: /vllm
    - name: HF_TOKEN
      valueFrom:
        secretKeyRef:
          key: HF_TOKEN
          name: huggingface-secret
  volumeMounts:
    - name: shm
      mountPath: /dev/shm
    - name: vllm-chat-templates
      mountPath: /chat-templates
    - name: vllm-home
      mountPath: /vllm
  volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 2Gi
    - name: vllm-chat-templates
      configMap:
        name: vllm-chat-templates
    - name: vllm-home
      emptyDir: {}

secret:
  enabled: true
  hf_token: ""

models:
  llama-3-2-1b-instruct:
    id: meta-llama/Llama-3.2-1B-Instruct
    enabled: false
    args:
      - --enable-auto-tool-choice
      - --chat-template
      - /chat-templates/tool_chat_template_llama3.2_json.jinja
      - --tool-call-parser
      - llama3_json
      - --max-model-len
      - "30544"
      - --gpu-memory-utilization
      - "0.85"
      - --block-size
      - "128"
      - --dtype
      - bfloat16  

  llama-guard-3-1b:
    id: meta-llama/Llama-Guard-3-1B
    enabled: false
    args:
      - --max-model-len
      - "14336"
      - --gpu-memory-utilization
      - "0.85"
      - --block-size
      - "128"
      - --dtype
      - bfloat16  

  llama-3-2-3b-instruct:
