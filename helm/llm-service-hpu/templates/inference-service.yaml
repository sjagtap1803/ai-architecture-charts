{{- $root := . }}
{{- $models := include "llm-service.mergeModels" . | fromJson }}
{{- range $key, $model := $models }}
{{- if and $model.enabled (not $model.url) }}
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: {{ $key }}
  annotations:
    openshift.io/display-name: {{ $key }}
    serving.knative.openshift.io/enablePassthrough: "true"
    sidecar.istio.io/inject: "true"
    sidecar.istio.io/rewriteAppHTTPProbers: "true"
    {{- if $root.Values.rawDeploymentMode }}
    serving.kserve.io/deploymentMode: RawDeployment
    {{- end }}
  labels:
    opendatahub.io/dashboard: "true"
    networking.knative.dev/visibility: "cluster-local"
spec:
  predictor:
    maxReplicas: {{ $model.maxReplicas | default 1 }}
    minReplicas: {{ $model.minReplicas | default 1 }}
    model:
      modelFormat:
        name: vLLM
      name: ""
      resources:
        limits:
          cpu: "2"
          memory: 8Gi
          habana.ai/gaudi: {{ $model.numDevices | default "1" }}
        requests:
          cpu: "1"
          memory: 4Gi
          habana.ai/gaudi: {{ $model.numDevices | default "1" }}
          ephemeral-storage: {{ $model.storageSize | default "50Gi" }}
      runtime: {{ $root.Values.servingRuntime.name }}
      args:
      - --model
      - {{ $model.id }}
      - --served-model-name
      - {{ $model.id }}
      {{- with $model.args }}
        {{- toYaml . | nindent 6 }}
      {{- end }}
      env:
        - name: VLLM_SKIP_WARMUP
          value: "false"
        - name: VLLM_GRAPH_RESERVED_MEM
          value: "0.25"
    {{- with $model.tolerations }}
    tolerations:
    {{- toYaml $model.tolerations | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
